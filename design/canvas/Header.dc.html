<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رأس الموقع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header dir="rtl" style="width: 100%; min-height: 84px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E2E0DA; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0F1E33;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0F1E33;">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0F1E33"></rect><path d="M10 30V10h20v20h-7" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"></path><path d="M10 19h9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"></path><path d="M23 30a9 9 0 0 0-9-9" stroke="#E8833A" stroke-width="2.6" fill="none" stroke-linecap="round"></path></svg>
      <span style="display: flex; flex-direction: column; line-height: 1.15;"><span style="font-family: Alexandria, sans-serif; font-weight: 700; font-size: 20px;">بناء وتأثيث</span><span style="font-size: 11.5px; color: #5E6470;">من المخطط إلى المفتاح</span></span>
    </a>
    <nav aria-label="القائمة الرئيسية" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 420px;">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="5">
        <a href="{{l.href}}" style="{{l.style}}">{{l.label}}</a>
      </sc-for>
    </nav>
    <div style="display: flex; gap: 10px; align-items: center;">
      <a href="Auth.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #C9CEDA; color: #0F1E33; font-weight: 600; font-size: 15px; text-decoration: none;">دخول</a>
      <a href="NewRequest.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 12px; background: #1F4FA3; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none;">ابدأ طلبك</a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","services","offices","about","track"],"default":"home"},"$preview":{"width":1440,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const base = 'display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:500;text-decoration:none;';
    const items = [
      ['home', 'الرئيسية', 'Main.dc.html'],
      ['services', 'الخدمات', 'Services.dc.html'],
      ['offices', 'المكاتب الهندسية', 'Offices.dc.html'],
      ['about', 'من نحن', 'About.dc.html'],
      ['track', 'تتبع طلب', 'Track.dc.html']
    ];
    return {
      links: items.map(([k, label, href]) => ({
        label, href,
        style: base + (k === active ? 'background:#E7EEF9;color:#1F4FA3;font-weight:600;' : 'color:#3B4250;')
      }))
    };
  }
}
</script>
</body>
</html>

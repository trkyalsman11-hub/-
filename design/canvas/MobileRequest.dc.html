<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الجوال: طلب جديد</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F3EF; color: #0F1E33; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 15px; line-height: 1.7; display: flex; flex-direction: column;">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E0DA; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 8px;"><a href="MobileHome.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #0F1E33;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a><b style="font-family: Alexandria, sans-serif; font-size: 18px;">طلب جديد</b><span style="margin-right: auto; font-size: 13px; color: #5E6470;">1 من 3</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 0 4px 4px;"><span style="height: 5px; border-radius: 3px; background: #1F4FA3;"></span><span style="height: 5px; border-radius: 3px; background: #DCDAD3;"></span><span style="height: 5px; border-radius: 3px; background: #DCDAD3;"></span></div>
  </header>
  <form style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-family: Alexandria, sans-serif; font-size: 22px;">ما نوع الخدمة؟</h1>
    <div role="radiogroup" aria-label="نوع الخدمة" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}"><dc-import name="Illus" kind="{{t.kind}}" hint-size="100%,100px"></dc-import><b style="font-size: 14px;">{{t.label}}</b></button>
      </sc-for>
    </div>
    <div><label for="m_title" style="display: block; font-size: 13px; color: #5E6470; font-weight: 500; margin-bottom: 6px;">عنوان الطلب</label><input id="m_title" value="فيلا سكنية · حي النرجس" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #D6D4CD; font: inherit; background: #FFFFFF;"></div>
  </form>
  <div style="padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E2E0DA;"><button type="button" style="width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: #1F4FA3; color: #FFFFFF; font: 600 16px 'IBM Plex Sans Arabic', sans-serif;">التالي</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { type: 'office' }; }
  renderVals() {
    const T = [['office', 'تصميم هندسي'], ['contractor', 'مقاولات'], ['furnish', 'تأثيث'], ['developer', 'تطوير عقاري']];
    return {
      types: T.map(([k, label]) => ({
        kind: k, label, on: k === this.state.type ? 'true' : 'false', pick: () => this.setState({ type: k }),
        style: 'display:flex;flex-direction:column;gap:6px;padding:6px 6px 10px;border-radius:14px;background:#FFFFFF;font:inherit;color:#0F1E33;cursor:pointer;' + (k === this.state.type ? 'border:2px solid #1F4FA3;' : 'border:1px solid #E2E0DA;')
      }))
    };
  }
}
</script>
</body>
</html>
